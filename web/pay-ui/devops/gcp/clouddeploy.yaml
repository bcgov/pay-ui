apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: pay-ui-pipeline
description: Deployment pipeline
serialPipeline:
  stages:
    - targetId: gtksf3-dev
      profiles: [dev]
      strategy:
        standard:
          verify: false
      deployParameters:
        - values:
            deploy-env: "development"
            deploy-project-id: "gtksf3-dev"
            service-name: "pay-ui-dev"
            container-name: "pay-ui-dev"
            cloudsql-instances: ""
            service-account: "sa-api@gtksf3-dev.iam.gserviceaccount.com"
    - targetId: gtksf3-test
      profiles: [test]
      strategy:
        standard:
          verify: false
      deployParameters:
        - values:
            deploy-env: "test"
            deploy-project-id: "gtksf3-test"
            service-name: "pay-ui-test"
            container-name: "pay-ui-test"
            app-env: "test"
            cloudsql-instances: ""
            service-account: "sa-api@gtksf3-test.iam.gserviceaccount.com"
    - targetId: gtksf3-sandbox
      profiles: [sandbox]
      strategy:
        standard:
          verify: false
      deployParameters:
        - values:
            deploy-env: "sandbox"
            deploy-project-id: "gtksf3-tools"
            service-name: "pay-ui-sandbox"
            container-name: "pay-ui-sandbox"
            app-env: "sandbox"
            cloudsql-instances: ""
            service-account: "sa-api@gtksf3-tools.iam.gserviceaccount.com"
    - targetId: gtksf3-prod
      profiles: [prod]
      strategy:
        standard:
          verify: false
      deployParameters:
        - values:
            deploy-env: "production"
            deploy-project-id: "gtksf3-prod"
            service-name: "pay-ui-prod"
            container-name: "pay-ui-prod"
            app-env: "production"
            cloudsql-instances: ""
            service-account: "sa-api@gtksf3-prod.iam.gserviceaccount.com"
            max-scale: "10"
            container-concurrency: "20"
