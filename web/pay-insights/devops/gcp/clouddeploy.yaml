# Runs as sa-job (same as payment-jobs) so it can read fin-warehouse with PAY_JOBS_DW_IAM_USER.
# The warehouse is reached through the Cloud SQL Node connector (NUXT_WAREHOUSE_* in vaults.gcp.env),
# so no cloudsql-instances mount is needed (same as web/pay-ui).
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
 name: pay-insights-pipeline
description: Deployment pipeline
serialPipeline:
 stages:
 - targetId: gtksf3-dev
   profiles: [dev]
   strategy:
    standard:
      verify: false
   deployParameters:
   - values:
      deploy-env: "development"
      deploy-project-id: "gtksf3-dev"
      service-name: "pay-insights-dev"
      container-name: "pay-insights-dev"
      cloudsql-instances: ""
      service-account: "sa-job@gtksf3-dev.iam.gserviceaccount.com"
 - targetId: gtksf3-test
   profiles: [test]
   strategy:
    standard:
      verify: false
   deployParameters:
   - values:
      deploy-env: "development"
      deploy-project-id: "gtksf3-test"
      service-name: "pay-insights-test"
      container-name: "pay-insights-test"
      cloudsql-instances: ""
      service-account: "sa-job@gtksf3-test.iam.gserviceaccount.com"
 - targetId: gtksf3-prod
   profiles: [prod]
   strategy:
    standard:
      verify: false
   deployParameters:
   - values:
      deploy-env: "production"
      deploy-project-id: "gtksf3-prod"
      service-name: "pay-insights-prod"
      container-name: "pay-insights-prod"
      cloudsql-instances: ""
      service-account: "sa-job@gtksf3-prod.iam.gserviceaccount.com"
